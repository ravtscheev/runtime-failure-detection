# Repository configuration
repo_id: "ravtscheev/nut-assembly-ur5e-eef-eef"
push_to_hub: true
private_repo: false
tags:
  - "LeRobot"
  - "robotics"
  - "ur5e"
  - "manipulation"

# Dataset conversion configuration
input_path: "/home/tamer/is357_thesis_ws/runtime-failure-detection/data/mimicgen_generated/nut_assembly_UR5e/nut_assembly_task_D0_UR5e/demo.hdf5"
output_dir: "./data/lerobot/"

# Configuration for converting LeRobot HDF5 datasets
fps: 20
robot_type: "ur5e"
task: "Do something" # Default task name if task_mapping is not provided
task_mapping:
  "demo.hdf5": "Pick up the square nut and place it onto the square peg, then pick up the round nut and place it onto the round peg."
obs_mode: "eef"  # or "joint"
action_mode: "eef"
action_key: "actions"


batch_size: 4 # Default batch size for processing frames.